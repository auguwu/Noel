name: Build
on:
  workflow_dispatch: {}
  push:
    branches:
      - 'issues/gh-**'
      - master
    paths-ignore:
      - distribution
      - hack
      - nix
      - .bazelignore
      - .envrc
      - .git-blame-ignore-revs
      - .gitignore
      - .noel-version
      - docker-compose.yml
      - Dockerfile
      - flake.lock
      - LICENSE
      - '**.md'
      - .bazelrc
      - '.*.bazelrc'
      - renovate.jsonc
  pull_request:
    types: [opened, synchronize]
    branches:
      - 'issues/gh-**'
      - 'noel/**'
      - 'feat/**'
      - master
    paths:
      - '**'
permissions:
  contents: read
  checks: write
concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true
jobs:
  bazel:
    name: "Bazel / Build"
    runs-on: ubuntu-26.04
    env:
      BAZEL_STARTUP_FLAGS: "--bazelrc=.ci.bazelrc"
      USE_BAZEL_VERSION: "9.3.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: true
          bazelisk-cache: true
          disk-cache: noel-disk-cache

      - run: bazel ${{env.BAZEL_STARTUP_FLAGS}} build //... ${{env.BAZEL_FLAGS}}
      - run: bazel ${{env.BAZEL_STARTUP_FLAGS}} test //... ${{env.BAZEL_FLAGS}}
